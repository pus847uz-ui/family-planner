<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Planner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 84px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
    }
    #status {
      padding: 16px;
      font-size: 15px;
      color: var(--tg-theme-hint-color, #888888);
    }
    .page { display: none; }
    .page.active { display: block; }
    .quick-add { display: flex; gap: 8px; margin: 8px 0 16px; flex-wrap: wrap; }
    .quick-add input[type="text"] {
      flex: 1;
      min-width: 140px;
    }
    .quick-add input[type="date"], .quick-add input[type="time"] {
      flex: 0 0 auto;
    }
    input[type="text"], input[type="date"], input[type="number"], input[type="url"], select {
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--tg-theme-hint-color, #cccccc);
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #111111);
    }
    select { flex-shrink: 0; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    }
    .list li input[type="checkbox"] {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .list li .text { flex: 1; font-size: 16px; }
    .list li .due {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #999999);
      white-space: nowrap;
    }
    .empty {
      text-align: center;
      padding: 32px 0;
      color: var(--tg-theme-hint-color, #999999);
      font-size: 15px;
    }
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-top: 1px solid rgba(127, 127, 127, 0.25);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tabbar button {
      flex: 1;
      border: none;
      background: none;
      padding: 10px 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      color: var(--tg-theme-hint-color, #999999);
    }
    .tabbar button .icon { font-size: 20px; }
    .tabbar button.active { color: var(--tg-theme-button-color, #2481cc); }

    .event-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    }
    .event-form-row { display: flex; align-items: center; gap: 8px; }
    .event-form-row label {
      width: 52px;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #999999);
    }
    .event-form-row input { flex: 1; min-width: 0; }
    input[type="time"] { padding: 12px; font-size: 16px; border-radius: 10px;
      border: 1px solid var(--tg-theme-hint-color, #cccccc);
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111); }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 10px;
    }
    .cal-header .cal-title { font-weight: 600; font-size: 16px; text-transform: capitalize; }
    .cal-header button {
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      padding: 4px 14px;
      color: var(--tg-theme-button-color, #2481cc);
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      color: var(--tg-theme-hint-color, #999999);
      margin-bottom: 6px;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 14px;
      position: relative;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border: none;
      color: var(--tg-theme-text-color, #111111);
    }
    .cal-day.other-month { opacity: 0.35; }
    .cal-day.today { box-shadow: inset 0 0 0 2px var(--tg-theme-button-color, #2481cc); }
    .cal-day.selected {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .cal-day .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--tg-theme-button-color, #2481cc);
      position: absolute;
      bottom: 6px;
    }
    .cal-day.selected .dot { background: var(--tg-theme-button-text-color, #ffffff); }
    #agenda-title { font-size: 14px; color: var(--tg-theme-hint-color, #999999); margin: 0 0 8px; }
    .list li.event-row { cursor: pointer; }
    .list li .location-link {
      font-size: 16px;
      text-decoration: none;
      margin-left: 4px;
    }
    .form-actions { display: flex; gap: 8px; }
    .text-btn {
      flex: 1;
      border: none;
      background: none;
      padding: 8px;
      font-size: 14px;
      color: var(--tg-theme-link-color, #2481cc);
    }
    .text-btn.danger { color: var(--tg-theme-destructive-text-color, #e53935); }

    .location-row { display: flex; gap: 8px; }
    .location-row input { flex: 1; min-width: 0; }
    .location-row button {
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--tg-theme-bg-color, #ffffff);
      z-index: 1000;
      display: flex;
    }
    .modal-sheet {
      width: 100%;
      height: 100%;
      background: var(--tg-theme-bg-color, #ffffff);
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-header { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .modal-header input { flex: 1; min-width: 0; }
    .modal-header button {
      border: none;
      background: none;
      font-size: 20px;
      color: var(--tg-theme-hint-color, #999999);
      padding: 4px 8px;
      flex-shrink: 0;
    }
    .search-results {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 35vh;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .search-results:empty { display: none; }
    .search-results li {
      padding: 10px 8px;
      font-size: 14px;
      border-bottom: 1px solid rgba(127, 127, 127, 0.15);
    }
    #leaflet-map { flex: 1; min-height: 0; border-radius: 12px; }
    #picked-address {
      flex-shrink: 0;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #999999);
      padding: 4px 2px;
      min-height: 18px;
    }
    .period-toggle { display: flex; gap: 8px; margin: 0 0 16px; }
    .period-toggle .period-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #111111);
      font-size: 14px;
    }
    .period-toggle .period-btn.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .project-card { flex-direction: column; align-items: stretch; gap: 6px; cursor: pointer; }
    .project-card-header { display: flex; justify-content: space-between; gap: 8px; }
    .progress-bar {
      height: 6px;
      border-radius: 3px;
      background: rgba(127, 127, 127, 0.2);
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--tg-theme-button-color, #2481cc); }
    .progress-fill.over-limit { background: var(--tg-theme-destructive-text-color, #e53935); }
    #project-detail-summary {
      font-size: 15px;
      margin: 4px 0 16px;
      color: var(--tg-theme-hint-color, #999999);
    }
    .entry-buttons { display: flex; gap: 8px; }
    .entry-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      color: #ffffff;
    }
    .entry-btn.income { background: #2e7d32; }
    .entry-btn.expense { background: var(--tg-theme-destructive-text-color, #e53935); }
    .entry-amount.income { color: #2e7d32; }
    .entry-amount.expense { color: var(--tg-theme-destructive-text-color, #e53935); }
    .map-confirm-btn {
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
  </style>
</head>
<body>
  <div id="status">Проверяем доступ...</div>

  <div id="app" style="display: none;">
    <section id="page-tasks" class="page active">
      <div class="quick-add">
        <input id="task-text" type="text" placeholder="Новая задача">
        <input id="task-due" type="date" title="Срок (необязательно)">
      </div>
      <ul id="tasks-list" class="list"></ul>
    </section>

    <section id="page-shopping" class="page">
      <div class="quick-add">
        <input id="shopping-text" type="text" placeholder="Что купить?">
      </div>
      <ul id="shopping-list" class="list"></ul>
    </section>

    <section id="page-calendar" class="page">
      <div class="event-form">
        <input id="event-title" type="text" placeholder="Название события">
        <div class="event-form-row">
          <label>Начало</label>
          <input id="event-start-date" type="date">
          <input id="event-start-time" type="time">
        </div>
        <div class="event-form-row">
          <label>Конец</label>
          <input id="event-end-date" type="date">
          <input id="event-end-time" type="time">
        </div>
        <input id="event-place" type="text" placeholder="Место (необязательно)">
        <div class="location-row">
          <input id="event-location" type="url" placeholder="Ссылка на карту (необязательно)">
          <button type="button" id="event-pick-location-btn">📍 Карта</button>
        </div>
        <div class="form-actions" id="event-form-actions" style="display: none;">
          <button type="button" class="text-btn danger" id="event-delete-btn">Удалить событие</button>
          <button type="button" class="text-btn" id="event-cancel-btn">Отмена</button>
        </div>
      </div>

      <div class="cal-header">
        <button id="cal-prev" type="button">‹</button>
        <span class="cal-title" id="cal-title"></span>
        <button id="cal-next" type="button">›</button>
      </div>
      <div class="cal-weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>

      <div id="agenda-title"></div>
      <ul id="events-list" class="list"></ul>
    </section>

    <section id="page-budget" class="page">
      <div class="period-toggle" id="budget-subnav">
        <button type="button" class="period-btn active" data-budget-sub="projects">Проекты</button>
        <button type="button" class="period-btn" data-budget-sub="recurring">Платежи</button>
      </div>

      <div id="budget-projects-view">
        <div class="event-form">
          <input id="project-title" type="text" placeholder="Название проекта (например, «Ремонт кухни»)">
          <div class="event-form-row">
            <input id="project-limit" type="number" step="0.01" min="0" placeholder="Ориентировочный лимит">
            <select id="project-currency"></select>
          </div>
        </div>

        <div class="period-toggle" id="budget-archive-filter">
          <button type="button" class="period-btn active" data-archive="active">Активные</button>
          <button type="button" class="period-btn" data-archive="archived">Архив</button>
        </div>

        <ul id="projects-list" class="list"></ul>
      </div>

      <div id="budget-project-detail-view" style="display: none;">
        <h2 id="project-detail-title"></h2>
        <div id="project-detail-summary"></div>

        <div class="event-form">
          <input id="entry-amount" type="number" step="0.01" min="0" placeholder="Сумма">
          <input id="entry-comment" type="text" placeholder="Комментарий / #хэштег (необязательно)">
          <div class="entry-buttons">
            <button type="button" id="entry-income-btn" class="entry-btn income">+ Доход</button>
            <button type="button" id="entry-expense-btn" class="entry-btn expense">− Расход</button>
          </div>
        </div>

        <button type="button" id="project-archive-btn" class="text-btn">Архивировать проект</button>

        <ul id="entries-list" class="list"></ul>
      </div>

      <div id="budget-recurring-view" style="display: none;">
        <div class="event-form">
          <input id="recurring-title" type="text" placeholder="Название платежа (например, «Ипотека»)">
          <div class="event-form-row">
            <input id="recurring-amount" type="number" step="0.01" min="0" placeholder="Сумма">
            <select id="recurring-currency"></select>
          </div>
          <input id="recurring-day" type="number" min="1" max="31" placeholder="День месяца (1–31)">
        </div>
        <ul id="recurring-list" class="list"></ul>
      </div>
    </section>
  </div>

  <nav class="tabbar" id="tabbar" style="display: none;">
    <button class="tab active" data-page="tasks">
      <span class="icon">📋</span><span>Задачи</span>
    </button>
    <button class="tab" data-page="shopping">
      <span class="icon">🛒</span><span>Покупки</span>
    </button>
    <button class="tab" data-page="calendar">
      <span class="icon">📅</span><span>Календарь</span>
    </button>
    <button class="tab" data-page="budget">
      <span class="icon">💰</span><span>Бюджет</span>
    </button>
  </nav>

  <div id="map-modal" class="modal-overlay" style="display: none;">
    <div class="modal-sheet">
      <div class="modal-header">
        <input id="map-search-input" type="text" placeholder="Найти место...">
        <button type="button" id="map-search-btn">🔍</button>
        <button type="button" id="map-modal-close">✕</button>
      </div>
      <ul id="map-search-results" class="search-results"></ul>
      <div id="leaflet-map"></div>
      <div id="picked-address"></div>
      <button type="button" id="map-confirm-btn" class="map-confirm-btn">Выбрать эту точку</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
      query, where, orderBy, onSnapshot, serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "family-planner-54d84",
      appId: "1:688518650414:web:8986f3add72df0ca8e5dbf",
      storageBucket: "family-planner-54d84.firebasestorage.app",
      apiKey: "AIzaSyCx7ENumcKmfr_-j3_g0mi5h0-FtTOLIOQ",
      authDomain: "family-planner-54d84.firebaseapp.com",
      messagingSenderId: "688518650414",
      measurementId: "G-ZJWGHZ7B8F",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusEl = document.getElementById("status");
    const appEl = document.getElementById("app");
    const tabbarEl = document.getElementById("tabbar");
    const tasksList = document.getElementById("tasks-list");
    const shoppingList = document.getElementById("shopping-list");
    const taskTextInput = document.getElementById("task-text");
    const taskDueInput = document.getElementById("task-due");
    const shoppingTextInput = document.getElementById("shopping-text");
    const eventsList = document.getElementById("events-list");
    const eventTitleInput = document.getElementById("event-title");
    const eventStartDateInput = document.getElementById("event-start-date");
    const eventStartTimeInput = document.getElementById("event-start-time");
    const eventEndDateInput = document.getElementById("event-end-date");
    const eventEndTimeInput = document.getElementById("event-end-time");
    const eventPlaceInput = document.getElementById("event-place");
    const eventLocationInput = document.getElementById("event-location");
    const eventPickLocationBtn = document.getElementById("event-pick-location-btn");
    const mapModal = document.getElementById("map-modal");
    const mapModalClose = document.getElementById("map-modal-close");
    const mapSearchInput = document.getElementById("map-search-input");
    const mapSearchBtn = document.getElementById("map-search-btn");
    const mapSearchResults = document.getElementById("map-search-results");
    const mapConfirmBtn = document.getElementById("map-confirm-btn");
    const eventFormActions = document.getElementById("event-form-actions");
    const eventDeleteBtn = document.getElementById("event-delete-btn");
    const eventCancelBtn = document.getElementById("event-cancel-btn");
    const calTitleEl = document.getElementById("cal-title");
    const calGridEl = document.getElementById("cal-grid");
    const agendaTitleEl = document.getElementById("agenda-title");
    const calPrevBtn = document.getElementById("cal-prev");
    const calNextBtn = document.getElementById("cal-next");

    const budgetProjectsViewEl = document.getElementById("budget-projects-view");
    const budgetProjectDetailViewEl = document.getElementById("budget-project-detail-view");
    const budgetRecurringViewEl = document.getElementById("budget-recurring-view");
    const projectTitleInput = document.getElementById("project-title");
    const projectLimitInput = document.getElementById("project-limit");
    const projectCurrencySelect = document.getElementById("project-currency");
    const projectsListEl = document.getElementById("projects-list");
    const projectDetailTitleEl = document.getElementById("project-detail-title");
    const projectDetailSummaryEl = document.getElementById("project-detail-summary");
    const entryAmountInput = document.getElementById("entry-amount");
    const entryCommentInput = document.getElementById("entry-comment");
    const entryIncomeBtn = document.getElementById("entry-income-btn");
    const entryExpenseBtn = document.getElementById("entry-expense-btn");
    const projectArchiveBtn = document.getElementById("project-archive-btn");
    const entriesListEl = document.getElementById("entries-list");
    const recurringTitleInput = document.getElementById("recurring-title");
    const recurringAmountInput = document.getElementById("recurring-amount");
    const recurringCurrencySelect = document.getElementById("recurring-currency");
    const recurringDayInput = document.getElementById("recurring-day");
    const recurringListEl = document.getElementById("recurring-list");

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const VERIFY_URL =
      "https://us-central1-family-planner-54d84.cloudfunctions.net/verifyInitData";

    // ---- Навигация между «страницами» (табы внизу) ----
    let currentPage = "tasks";

    const pages = {
      tasks: { mainButtonText: "Добавить задачу", add: addTask },
      shopping: { mainButtonText: "Добавить покупку", add: addShoppingItem },
      calendar: { mainButtonText: "Добавить событие", add: saveEvent },
      budget: { mainButtonText: "Создать проект", add: createProject },
    };

    function switchPage(pageId) {
      if (currentPage === "calendar" && pageId !== "calendar" && editingEventId) {
        resetEventForm();
      }
      if (currentPage === "budget" && pageId !== "budget" && activeProjectId) {
        closeProjectDetail();
      }
      currentPage = pageId;
      document.querySelectorAll(".page").forEach((el) => {
        el.classList.toggle("active", el.id === "page-" + pageId);
      });
      document.querySelectorAll(".tabbar .tab").forEach((el) => {
        el.classList.toggle("active", el.dataset.page === pageId);
      });
      tg.MainButton.setText(pages[pageId].mainButtonText);
    }

    document.querySelectorAll(".tabbar .tab").forEach((btn) => {
      btn.addEventListener("click", () => switchPage(btn.dataset.page));
    });

    tg.MainButton.onClick(() => {
      pages[currentPage].add();
    });

    function haptic(type) {
      if (tg.HapticFeedback) {
        if (type === "error") tg.HapticFeedback.notificationOccurred("error");
        else if (type === "success") tg.HapticFeedback.notificationOccurred("success");
        else tg.HapticFeedback.impactOccurred("light");
      }
    }

    // ---- Карта (выбор места для события) ----
    let leafletMap = null;
    let leafletMarker = null;
    const pickedAddressEl = document.getElementById("picked-address");

    function ensureMapInitialized() {
      if (leafletMap) return;
      leafletMap = L.map("leaflet-map").setView([55.75, 37.62], 4);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        attribution: "© OpenStreetMap © CARTO",
        maxZoom: 19,
      }).addTo(leafletMap);
      leafletMarker = L.marker([55.75, 37.62], { draggable: true }).addTo(leafletMap);

      leafletMap.on("click", (e) => {
        leafletMarker.setLatLng(e.latlng);
        updateAddressLabel(e.latlng);
      });
      leafletMarker.on("dragend", () => {
        updateAddressLabel(leafletMarker.getLatLng());
      });
    }

    async function updateAddressLabel(latlng) {
      pickedAddressEl.textContent = "Определяю адрес...";
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`
        );
        const data = await res.json();
        pickedAddressEl.textContent = data.display_name || "Адрес не определён";
      } catch (err) {
        pickedAddressEl.textContent = "Не удалось определить адрес";
      }
    }

    function centerMapOnBestGuess() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
            leafletMap.setView(latlng, 14);
            leafletMarker.setLatLng(latlng);
            updateAddressLabel(latlng);
          },
          () => {}, // геолокация недоступна/запрещена — остаёмся на дефолтном виде
          { timeout: 4000 }
        );
      }
    }

    function openMapModal() {
      mapModal.style.display = "flex";
      mapSearchResults.innerHTML = "";
      mapSearchInput.value = "";
      pickedAddressEl.textContent = "";
      ensureMapInitialized();
      setTimeout(() => {
        leafletMap.invalidateSize();
        // если у события уже есть ссылка с координатами — открываем карту на них,
        // иначе пытаемся определить текущее местоположение
        const match = eventLocationInput.value.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (match) {
          const latlng = L.latLng(Number(match[1]), Number(match[2]));
          leafletMap.setView(latlng, 15);
          leafletMarker.setLatLng(latlng);
          updateAddressLabel(latlng);
        } else {
          centerMapOnBestGuess();
        }
      }, 50);
    }

    function closeMapModal() {
      mapModal.style.display = "none";
    }

    let searchDebounceTimer = null;

    async function searchPlace() {
      const q = mapSearchInput.value.trim();
      if (!q) {
        mapSearchResults.innerHTML = "";
        return;
      }
      mapSearchResults.innerHTML = '<li>Ищу...</li>';
      try {
        const res = await fetch(
          "https://nominatim.openstreetmap.org/search?format=json&limit=5&q=" +
            encodeURIComponent(q)
        );
        const results = await res.json();
        mapSearchResults.innerHTML = "";
        if (results.length === 0) {
          mapSearchResults.innerHTML = '<li>Ничего не найдено</li>';
          return;
        }
        results.forEach((place) => {
          const li = document.createElement("li");
          li.textContent = place.display_name;
          li.addEventListener("click", () => {
            const latlng = L.latLng(Number(place.lat), Number(place.lon));
            leafletMap.setView(latlng, 16);
            leafletMarker.setLatLng(latlng);
            pickedAddressEl.textContent = place.display_name;
            if (!eventPlaceInput.value.trim()) {
              eventPlaceInput.value = place.display_name.split(",")[0];
            }
            mapSearchResults.innerHTML = "";
          });
          mapSearchResults.appendChild(li);
        });
      } catch (err) {
        mapSearchResults.innerHTML = '<li>Ошибка поиска</li>';
      }
    }

    eventPickLocationBtn.addEventListener("click", openMapModal);
    mapModalClose.addEventListener("click", closeMapModal);
    mapSearchBtn.addEventListener("click", searchPlace);
    mapSearchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(searchDebounceTimer);
        searchPlace();
      }
    });
    mapSearchInput.addEventListener("input", () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(searchPlace, 500);
    });
    mapConfirmBtn.addEventListener("click", () => {
      const latlng = leafletMarker.getLatLng();

        `https://www.google.com/maps?q=${latlng.lat.toFixed(6)},${latlng.lng.toFixed(6)}`;

    function openLocationChoice(url) {
      const match = url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (!match) {
        // ссылка вставлена вручную не в нашем формате — просто открываем как есть
        tg.openLink(url);
        return;
      }
      const [, lat, lng] = match;
      const googleUrl = `https://www.google.com/maps?q=${lat},${lng}`;
      const yandexUrl = `https://yandex.ru/maps/?pt=${lng},${lat}&z=16&l=map`;

      tg.showPopup(
        {
          title: "Открыть карту",
          message: "В каком приложении открыть место?",
          buttons: [
            { id: "google", type: "default", text: "Google Maps" },
            { id: "yandex", type: "default", text: "Яндекс.Карты" },
            { id: "cancel", type: "cancel" },
          ],
        },
        (buttonId) => {
          if (buttonId === "google") tg.openLink(googleUrl);
          else if (buttonId === "yandex") tg.openLink(yandexUrl);
        }
      );
    }

    // ---- Календарь ----
    const MONTH_NAMES = [
      "январь", "февраль", "март", "апрель", "май", "июнь",
      "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь",
    ];
    function localDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    let allEvents = []; // все события из Firestore, живут в памяти для отрисовки сетки+повестки
    let calendarViewDate = new Date(); // первое число месяца, который сейчас показан в сетке
    calendarViewDate.setDate(1);
    let selectedDate = new Date(); // выбранный день (для повестки снизу)
    let editingEventId = null; // id события, которое сейчас редактируется, или null (режим добавления)

    function eventsOnDate(dateObj) {
      const key = localDateStr(dateObj);
      return allEvents
        .filter((ev) => key >= ev.startDate && key <= (ev.endDate || ev.startDate))
        .sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));
    }

    function renderCalendarGrid() {
      calTitleEl.textContent =
        MONTH_NAMES[calendarViewDate.getMonth()] + " " + calendarViewDate.getFullYear();

      const firstOfMonth = new Date(calendarViewDate);
      const firstWeekday = (firstOfMonth.getDay() + 6) % 7; // 0=Пн
      const gridStart = new Date(firstOfMonth);
      gridStart.setDate(gridStart.getDate() - firstWeekday);

      const todayKey = localDateStr(new Date());
      const selectedKey = localDateStr(selectedDate);

      calGridEl.innerHTML = "";
      for (let i = 0; i < 42; i++) {
        const cellDate = new Date(gridStart);
        cellDate.setDate(gridStart.getDate() + i);
        const cellKey = localDateStr(cellDate);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cal-day";
        if (cellDate.getMonth() !== calendarViewDate.getMonth()) btn.classList.add("other-month");
        if (cellKey === todayKey) btn.classList.add("today");
        if (cellKey === selectedKey) btn.classList.add("selected");

        const num = document.createElement("span");
        num.textContent = cellDate.getDate();
        btn.appendChild(num);

        if (eventsOnDate(cellDate).length > 0) {
          const dot = document.createElement("span");
          dot.className = "dot";
          btn.appendChild(dot);
        }

        btn.addEventListener("click", () => {
          selectedDate = cellDate;
          renderCalendarGrid();
          renderAgenda();
        });

        calGridEl.appendChild(btn);
      }
    }

    function renderAgenda() {
      const todayKey = localDateStr(new Date());
      const tomorrowKey = localDateStr(new Date(Date.now() + 86400000));
      const selectedKey = localDateStr(selectedDate);

      if (selectedKey === todayKey) agendaTitleEl.textContent = "Сегодня";
      else if (selectedKey === tomorrowKey) agendaTitleEl.textContent = "Завтра";
      else {
        agendaTitleEl.textContent = selectedDate.toLocaleDateString("ru-RU", {
          day: "numeric", month: "long", weekday: "long",
        });
      }

      const dayEvents = eventsOnDate(selectedDate);
      eventsList.innerHTML = "";
      if (dayEvents.length === 0) {
        eventsList.innerHTML = '<li class="empty" style="background:none;">Событий нет</li>';
        return;
      }

      dayEvents.forEach((ev) => {
        const li = document.createElement("li");
        li.className = "event-row";
        li.addEventListener("click", () => startEditEvent(ev));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = ev.title;

        const when = document.createElement("span");
        when.className = "due";
        const multiDay = ev.endDate && ev.endDate !== ev.startDate;
        let whenText = ev.startTime ? ev.startTime : "весь день";
        if (ev.endTime && !multiDay) whenText += "–" + ev.endTime;
        if (multiDay) whenText += " → " + ev.endDate;
        if (ev.place) whenText += " · " + ev.place;
        when.textContent = whenText;

        li.appendChild(text);
        li.appendChild(when);

        if (ev.locationUrl) {
          const link = document.createElement("a");
          link.className = "location-link";
          link.href = ev.locationUrl;
          link.textContent = "📍";
          link.addEventListener("click", (e) => {
            e.stopPropagation();
            e.preventDefault();
            openLocationChoice(ev.locationUrl);
          });
          li.appendChild(link);
        }

        eventsList.appendChild(li);
      });
    }

    function startEventsListener() {
      const eventsQuery = query(collection(db, "events"), orderBy("startAt", "asc"));
      onSnapshot(eventsQuery, (snapshot) => {
        allEvents = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderCalendarGrid();
        renderAgenda();
      }, (err) => {
        statusEl.textContent = "Ошибка загрузки календаря: " + err.message;
      });
    }

    calPrevBtn.addEventListener("click", () => {
      calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
      renderCalendarGrid();
    });
    calNextBtn.addEventListener("click", () => {
      calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
      renderCalendarGrid();
    });

    function startEditEvent(ev) {

      eventTitleInput.value = ev.title;
      eventStartDateInput.value = ev.startDate;

      eventEndTimeInput.value = ev.endTime || "";

      eventStartTimeInput.value = "";

    eventDeleteBtn.addEventListener("click", async () => {

    async function saveEvent() {
      const title = eventTitleInput.value.trim();
      const startDate = eventStartDateInput.value;
      if (!title || !startDate) {
        haptic("error");
        (title ? eventStartDateInput : eventTitleInput).focus();
        return;
      }

      const startTime = eventStartTimeInput.value || null;
      const endDate = eventEndDateInput.value || startDate;
      const endTime = eventEndTimeInput.value || null;
      const startAt = new Date(`${startDate}T${startTime || "00:00"}:00`);
      const eventData = {
        title,
        startDate,
        startTime,
        endDate,
        endTime,
        place: eventPlaceInput.value.trim() || null,
        locationUrl: eventLocationInput.value.trim() || null,
        startAt,
        // сбрасываем флаги напоминаний — если время события изменилось, напоминания должны прийти заново
        reminded1Day: false,
        reminded2Hours: false,
      };

      if (editingEventId) {
        await updateDoc(doc(db, "events", editingEventId), eventData);
      } else {
        await addDoc(collection(db, "events"), {
          ...eventData,
          authorUid: auth.currentUser.uid,
          createdAt: serverTimestamp(),
        });
      }

      resetEventForm();
      haptic("success");
    }

    // ---- Бюджет ----
    const CURRENCIES = {
      USD: "$", EUR: "€", UZS: "сум", RUB: "₽", KZT: "₸", PKR: "₨", GBP: "£", UAH: "₴",
    };
    let allProjects = [];
    let allEntries = [];
    let allRecurring = [];
    let currentArchiveFilter = "active";
    let activeProjectId = null;

    function populateCurrencySelect(selectEl) {
      Object.entries(CURRENCIES).forEach(([code, symbol]) => {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = `${code} (${symbol})`;
        selectEl.appendChild(opt);
      });
    }
    populateCurrencySelect(projectCurrencySelect);
    populateCurrencySelect(recurringCurrencySelect);

    function formatAmount(n, currency) {
      return `${Number(n).toLocaleString("ru-RU")} ${CURRENCIES[currency] || currency}`;
    }

    function projectStats(projectId) {
      const entries = allEntries.filter((e) => e.projectId === projectId);
      const totalExpense = entries.filter((e) => e.type === "expense").reduce((s, e) => s + e.amount, 0);
      const totalIncome = entries.filter((e) => e.type === "income").reduce((s, e) => s + e.amount, 0);
      return { entries, netSpent: totalExpense - totalIncome };
    }

    function renderProjects() {
      const filtered = allProjects
        .filter((p) => p.status === currentArchiveFilter)
        .slice()
        .sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

      projectsListEl.innerHTML = "";
      if (filtered.length === 0) {
        projectsListEl.innerHTML =
          '<li class="empty" style="background:none;">' +
          (currentArchiveFilter === "active" ? "Нет активных проектов" : "Архив пуст") +
          "</li>";
        return;
      }

      filtered.forEach((project) => {
        const { netSpent } = projectStats(project.id);
        const li = document.createElement("li");
        li.className = "project-card";

        const header = document.createElement("div");
        header.className = "project-card-header";
        const title = document.createElement("span");
        title.className = "text";
        title.textContent = project.title;
        const amounts = document.createElement("span");
        amounts.className = "due";
        amounts.textContent =
          `${formatAmount(netSpent, project.currency)} / ${formatAmount(project.limit, project.currency)}`;
        header.appendChild(title);
        header.appendChild(amounts);

        const bar = document.createElement("div");
        bar.className = "progress-bar";
        const fill = document.createElement("div");
        fill.className = "progress-fill" + (netSpent > project.limit ? " over-limit" : "");
        fill.style.width = Math.min(100, Math.max(0, (netSpent / project.limit) * 100)) + "%";
        bar.appendChild(fill);

        li.appendChild(header);
        li.appendChild(bar);
        li.addEventListener("click", () => openProjectDetail(project.id));
        projectsListEl.appendChild(li);
      });
    }

    function openProjectDetail(projectId) {
      activeProjectId = projectId;
      budgetProjectsViewEl.style.display = "none";
      budgetRecurringViewEl.style.display = "none";
      budgetProjectDetailViewEl.style.display = "block";
      tg.MainButton.hide();
      tg.BackButton.show();
      renderProjectDetail();
    }

    function closeProjectDetail() {
      activeProjectId = null;
      budgetProjectDetailViewEl.style.display = "none";
      budgetProjectsViewEl.style.display = "block";
      tg.BackButton.hide();
      if (currentPage === "budget") {
        tg.MainButton.setText(pages.budget.mainButtonText);
        tg.MainButton.show();
      }
    }

    function renderProjectDetail() {
      const project = allProjects.find((p) => p.id === activeProjectId);
      if (!project) {
        closeProjectDetail();
        return;
      }

      projectDetailTitleEl.textContent = project.title;
      const { entries, netSpent } = projectStats(project.id);
      const remaining = project.limit - netSpent;
      projectDetailSummaryEl.textContent =
        `Потрачено: ${formatAmount(netSpent, project.currency)} из ${formatAmount(project.limit, project.currency)}` +
        (remaining >= 0
          ? ` (осталось ${formatAmount(remaining, project.currency)})`
          : ` (превышение ${formatAmount(-remaining, project.currency)})`);

      entriesListEl.innerHTML = "";
      if (entries.length === 0) {
        entriesListEl.innerHTML = '<li class="empty" style="background:none;">Записей ещё нет</li>';
      } else {
        entries
          .slice()
          .sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0))
          .forEach((entry) => {
            const li = document.createElement("li");
            const sign = entry.type === "income" ? "+" : "−";
            const amount = document.createElement("span");
            amount.className = "text entry-amount " + entry.type;
            amount.textContent = `${sign} ${formatAmount(entry.amount, project.currency)}`;
            li.appendChild(amount);
            if (entry.comment) {
              const comment = document.createElement("span");
              comment.className = "due";
              comment.textContent = entry.comment;
              li.appendChild(comment);
            }
            entriesListEl.appendChild(li);
          });
      }

      projectArchiveBtn.textContent =
        project.status === "archived" ? "Вернуть из архива" : "Архивировать проект";
    }

        currency: projectCurrencySelect.value,

        createdAt: serverTimestamp(),

      projectLimitInput.value = "";

    function renderRecurring() {
      recurringListEl.innerHTML = "";
      if (allRecurring.length === 0) {
        recurringListEl.innerHTML = '<li class="empty" style="background:none;">Регулярных платежей нет</li>';
        return;
      }
      allRecurring
        .slice()
        .sort((a, b) => a.dueDay - b.dueDay)
        .forEach((payment) => {
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.className = "text";
          text.textContent = payment.title;
          const due = document.createElement("span");
          due.className = "due";
          due.textContent = `${formatAmount(payment.amount, payment.currency)} · ${payment.dueDay} числа`;
          li.appendChild(text);
          li.appendChild(due);
          recurringListEl.appendChild(li);
        });
    }

    async function addRecurringPayment() {
      const title = recurringTitleInput.value.trim();
      const amount = Number(recurringAmountInput.value);
      const dueDay = Number(recurringDayInput.value);
      if (!title || !amount || amount <= 0 || !dueDay || dueDay < 1 || dueDay > 31) {
        haptic("error");
        return;
      }

      await addDoc(collection(db, "recurring_payments"), {
        title,
        amount,
        currency: recurringCurrencySelect.value,
        dueDay,
        status: "active",
        authorUid: auth.currentUser.uid,
        createdAt: serverTimestamp(),
      });

      recurringTitleInput.value = "";
      recurringAmountInput.value = "";
      recurringDayInput.value = "";
      haptic("success");
    }

    function startBudgetListeners() {
      onSnapshot(collection(db, "budget_projects"), (snapshot) => {
        allProjects = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderProjects();
        if (activeProjectId) renderProjectDetail();
      });
      onSnapshot(collection(db, "budget_entries"), (snapshot) => {
        allEntries = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderProjects();
        if (activeProjectId) renderProjectDetail();
      });
      onSnapshot(collection(db, "recurring_payments"), (snapshot) => {
        allRecurring = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderRecurring();
      });
    }

    // ---- Вход ----
    async function signIn() {
      if (!tg.initData) {
        statusEl.textContent = "Открой это приложение из Telegram-бота.";
        return;
      }

      try {
        const response = await fetch(VERIFY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData }),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          if (response.status === 403) {
            statusEl.textContent = "Доступ запрещён: тебя нет в списке семьи.";
          } else {
            statusEl.textContent =
              "Не удалось проверить доступ (ошибка " + response.status + "): " +
              (body.detail || body.error || "нет подробностей");
          }
          return;
        }

        const { token } = await response.json();
        await signInWithCustomToken(auth, token);

        statusEl.style.display = "none";
        appEl.style.display = "block";
        tabbarEl.style.display = "flex";
        switchPage("tasks");
        tg.MainButton.color = tg.themeParams.button_color || "#2481cc";
        tg.MainButton.show();

        startTasksListener();
        startShoppingListener();
        startEventsListener();
        startBudgetListeners();
      } catch (err) {
        statusEl.textContent = "Ошибка: " + err.message;
      }
    }

    signIn();
  </script>
</body>
</html>
